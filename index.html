<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Letters to my baby</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="book-shell">
        
        <h1>Letters to my baby 
        </h1>

        <div class="page" id="write-page">
            <h3>Write a New Entry</h3>
            <textarea id="entry-input" placeholder="What's on your mind?"></textarea>
            <br>
            <button id="save-btn">Save to Diary</button>
        </div>

        <hr> <div class="page" id="read-page">
            <h3>Latest Entry</h3>
            <div id="entry-display">
                <em>No entries yet...</em>
            </div>
            
            <div class="reactions">
                <button>❤️</button>
                <button>🔥</button>
                <button>✏️ Add Note</button>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
